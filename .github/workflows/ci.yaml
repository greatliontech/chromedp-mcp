name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...

      - name: Cross-compile Windows
        run: |
          GOOS=windows go build ./...
          GOOS=windows go test -exec=true ./...

      - name: Configure Chrome
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor,
          # blocking Chromium's sandbox when chromedp resolves /usr/bin/chromium.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

          if bin=$(command -v chromium || command -v google-chrome || command -v chromium-browser); then
            echo "Using browser: $bin"
            "$bin" --version
          else
            tmpdeb=$(mktemp --suffix=.deb)
            trap 'rm -f "$tmpdeb"' EXIT
            curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o "$tmpdeb"
            chmod 644 "$tmpdeb"
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "$tmpdeb"
            google-chrome --version
          fi

      - name: Test
        run: go test -race -count=1 -timeout 600s ./...
