name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...

      - name: Cross-compile Windows and macOS
        run: |
          GOOS=windows go build ./...
          GOOS=windows go test -exec=true ./...
          GOOS=darwin go build ./...
          GOOS=darwin go test -exec=true ./...

      - name: Configure Chrome
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor,
          # blocking Chromium's sandbox when chromedp resolves /usr/bin/chromium.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

          if bin=$(command -v chromium || command -v chromium-browser || command -v google-chrome || command -v google-chrome-stable); then
            echo "Using browser: $bin"
            "$bin" --version
          else
            tmpdeb=$(mktemp --suffix=.deb)
            trap 'rm -f "$tmpdeb"' EXIT
            curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o "$tmpdeb"
            chmod 644 "$tmpdeb"
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "$tmpdeb"
            google-chrome --version
          fi

      - name: Test
        # Serialize package test binaries (-p=1) so concurrent Chrome-driving
        # packages do not starve software rendering (SwiftShader) under -race
        # on 4-vCPU runners.
        run: go test -p=1 -race -count=1 -timeout 600s ./...

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'greatliontech/chromedp-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.GLT_RELEASER_APP_ID }}
          private-key: ${{ secrets.GLT_RELEASER_APP_KEY }}

      - uses: greatliontech/semrel@main
        env:
          # Pin the release tag to the exact tested commit SHA instead of the
          # moving "main" ref so a later push cannot be tagged while CI runs.
          SEMREL_BRANCH: ${{ github.sha }}
        with:
          release: true
          releaseToken: ${{ steps.app-token.outputs.token }}
