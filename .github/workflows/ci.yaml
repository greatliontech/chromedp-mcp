name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, google-chrome]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...

      - name: Cross-compile Windows
        run: |
          GOOS=windows go build ./...
          GOOS=windows go test -exec=true ./...

      - name: Configure Chrome
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ "${{ matrix.browser }}" = "google-chrome" ]; then
            sudo rm -f /usr/bin/chromium /usr/bin/chromium-browser
          fi
          bin=$(command -v chromium || command -v google-chrome || command -v chromium-browser)
          echo "Using browser: $bin ($("$bin" --version))"

      - name: Test
        run: |
          set -o pipefail
          go test -p=1 -race -count=1 -timeout 600s ./...
